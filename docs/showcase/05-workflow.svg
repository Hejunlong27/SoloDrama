<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 560" width="1140" height="560" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <rect width="1140" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#8b95a3"/>
    </marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
      <path d="M0,0 L8,3.2 L0,6.4 z" fill="#3d4856"/>
    </marker>
  </defs>

  <text x="16" y="26" font-size="15" font-weight="700" fill="#16191f">SoloDrama 工作流程</text>
  <text x="16" y="46" font-size="11.5" fill="#6b7480">每一格都写一种产物；节点之间靠文件衔接，不靠函数调用。</text>

  <!-- ============ 行标签 ============ -->
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <rect x="16" y="64" width="96" height="66" rx="7" fill="#2e7d6f"/>
    <text x="64" y="92" fill="#ffffff">创作层</text>
    <text x="64" y="110" fill="#cfe6e1" font-size="10" font-weight="400">人 × LLM</text>

    <rect x="16" y="210" width="96" height="66" rx="7" fill="#9a6a10"/>
    <text x="64" y="232" fill="#ffffff">契约 + 资产</text>
    <text x="64" y="250" fill="#f0e2c4" font-size="10" font-weight="400">只认代号</text>
    <text x="64" y="264" fill="#f0e2c4" font-size="10" font-weight="400">机械转换</text>

    <rect x="16" y="356" width="96" height="66" rx="7" fill="#6b3fa0"/>
    <text x="64" y="378" fill="#ffffff">出片 + 交付</text>
    <text x="64" y="396" fill="#e2d7f0" font-size="10" font-weight="400">门禁逐级</text>
    <text x="64" y="410" fill="#e2d7f0" font-size="10" font-weight="400">按磁盘判</text>
  </g>

  <!-- ============ Row 1 ============ -->
  <g font-size="12.5" text-anchor="middle">
    <g>
      <rect x="130" y="64" width="170" height="66" rx="7" fill="#edf6f3" stroke="#2e7d6f" stroke-width="1.4"/>
      <text x="215" y="88" font-weight="700" fill="#1d5c51">创作模板</text>
      <text x="215" y="106" font-size="10.5" fill="#4f746c">题材套路 · 阶段划分</text>
      <text x="215" y="120" font-size="10" fill="#8aa6a0">skills.json</text>
    </g>
    <g>
      <rect x="328" y="64" width="170" height="66" rx="7" fill="#edf6f3" stroke="#2e7d6f" stroke-width="1.4"/>
      <text x="413" y="88" font-weight="700" fill="#1d5c51">企划案</text>
      <text x="413" y="106" font-size="10.5" fill="#4f746c">故事 · 人物 · 关系 · 伏笔</text>
      <text x="413" y="120" font-size="10" fill="#8aa6a0">01-企划案.md</text>
    </g>
    <g>
      <rect x="526" y="64" width="170" height="66" rx="7" fill="#edf6f3" stroke="#2e7d6f" stroke-width="1.4"/>
      <text x="611" y="88" font-weight="700" fill="#1d5c51">资产库</text>
      <text x="611" y="106" font-size="10.5" fill="#4f746c">人物 / 场景 / 道具提示词卡</text>
      <text x="611" y="120" font-size="10" fill="#8aa6a0">02-资产库.md</text>
    </g>
    <g>
      <rect x="724" y="64" width="170" height="66" rx="7" fill="#edf6f3" stroke="#2e7d6f" stroke-width="1.4"/>
      <text x="809" y="88" font-weight="700" fill="#1d5c51">剧本</text>
      <text x="809" y="106" font-size="10.5" fill="#4f746c">分集台词 · 时长审计</text>
      <text x="809" y="120" font-size="10" fill="#8aa6a0">03-分集剧本.md</text>
    </g>
    <g>
      <rect x="922" y="64" width="170" height="66" rx="7" fill="#edf6f3" stroke="#2e7d6f" stroke-width="1.4"/>
      <text x="1007" y="88" font-weight="700" fill="#1d5c51">导演手册</text>
      <text x="1007" y="106" font-size="10.5" fill="#4f746c">分镜 · 两段提示词</text>
      <text x="1007" y="120" font-size="10" fill="#b3352f">4–5 镜/批 · 可续写</text>
    </g>
  </g>
  <g stroke="#8b95a3" stroke-width="1.3" marker-end="url(#ar)">
    <line x1="300" y1="97" x2="323" y2="97"/>
    <line x1="498" y1="97" x2="521" y2="97"/>
    <line x1="696" y1="97" x2="719" y2="97"/>
    <line x1="894" y1="97" x2="917" y2="97"/>
  </g>

  <!-- 行间 1 -->
  <line x1="64" y1="134" x2="64" y2="204" stroke="#3d4856" stroke-width="2" marker-end="url(#arb)"/>
  <text x="84" y="156" font-size="11.5" font-weight="700" fill="#7a5310">md2pack · 机械转换</text>
  <text x="84" y="173" font-size="10.5" fill="#6b7480">只做识别与搬运：不改一个字台词，不补一句提示词。</text>
  <text x="84" y="189" font-size="10.5" fill="#6b7480">找不到的提示词不猜 —— 逐条写进缺口报告，由人决定补不补。</text>

  <!-- ============ Row 2 ============ -->
  <g font-size="12.5" text-anchor="middle">
    <g>
      <rect x="130" y="210" width="170" height="66" rx="7" fill="#fbf4e6" stroke="#9a6a10" stroke-width="1.4"/>
      <text x="215" y="234" font-weight="700" fill="#7a5310">转换</text>
      <text x="215" y="252" font-size="10.5" fill="#7d6432">名字 → 代号 · 缺口报告</text>
      <text x="215" y="266" font-size="10" fill="#a08a5c">convert.apply</text>
    </g>
    <g>
      <rect x="328" y="210" width="170" height="66" rx="7" fill="#fbf4e6" stroke="#9a6a10" stroke-width="1.4"/>
      <text x="413" y="234" font-weight="700" fill="#7a5310">制作包</text>
      <text x="413" y="252" font-size="10.5" fill="#7d6432">唯一交换格式</text>
      <text x="413" y="266" font-size="10" fill="#a08a5c">pack/*.json</text>
    </g>
    <g>
      <rect x="526" y="210" width="170" height="66" rx="7" fill="#fbf4e6" stroke="#9a6a10" stroke-width="1.4"/>
      <text x="611" y="234" font-weight="700" fill="#7a5310">导入</text>
      <text x="611" y="252" font-size="10.5" fill="#7d6432">校验 · 落盘 · 回填参考图</text>
      <text x="611" y="266" font-size="10" fill="#a08a5c">06-提示词/&lt;ep&gt;/</text>
    </g>
    <g>
      <rect x="724" y="210" width="170" height="66" rx="7" fill="#eef3f9" stroke="#1f4e79" stroke-width="1.4"/>
      <text x="809" y="234" font-weight="700" fill="#163a5c">资产出图</text>
      <text x="809" y="252" font-size="10.5" fill="#4a6a8a">三视图 → 造型 → 表情</text>
      <text x="809" y="266" font-size="10" fill="#8aa0b5">04-资产/</text>
    </g>
    <g>
      <rect x="922" y="210" width="170" height="66" rx="7" fill="#eef3f9" stroke="#1f4e79" stroke-width="1.4"/>
      <text x="1007" y="234" font-weight="700" fill="#163a5c">分镜图</text>
      <text x="1007" y="252" font-size="10.5" fill="#4a6a8a">每镜一张 9:16 首帧</text>
      <text x="1007" y="266" font-size="10" fill="#8aa0b5">04-资产/boards/</text>
    </g>
  </g>
  <g stroke="#8b95a3" stroke-width="1.3" marker-end="url(#ar)">
    <line x1="300" y1="243" x2="323" y2="243"/>
    <line x1="498" y1="243" x2="521" y2="243"/>
    <line x1="696" y1="243" x2="719" y2="243"/>
    <line x1="894" y1="243" x2="917" y2="243"/>
  </g>

  <!-- 行间 2 -->
  <line x1="64" y1="280" x2="64" y2="350" stroke="#3d4856" stroke-width="2" marker-end="url(#arb)"/>
  <text x="84" y="302" font-size="11.5" font-weight="700" fill="#163a5c">预检 → 提交 → 归档</text>
  <text x="84" y="319" font-size="10.5" fill="#6b7480">出片前先核 地址 · 节点 · 模型 · 必需输入；核的必须是将要提交的那一份。</text>
  <text x="84" y="335" font-size="10.5" fill="#6b7480">本地与云端同一条命令，只换执行地址；产物跑完一镜就落盘，停机前再补一次。</text>

  <!-- ============ Row 3 ============ -->
  <g font-size="12.5" text-anchor="middle">
    <g>
      <rect x="130" y="356" width="170" height="66" rx="7" fill="#eef3f9" stroke="#1f4e79" stroke-width="1.4"/>
      <text x="215" y="380" font-weight="700" fill="#163a5c">分镜出片</text>
      <text x="215" y="398" font-size="10.5" fill="#4a6a8a">镜头级画幅 · 缺哪补哪</text>
      <text x="215" y="412" font-size="10" fill="#8aa0b5">shot_NNN/final.mp4</text>
    </g>
    <g>
      <rect x="328" y="356" width="170" height="66" rx="7" fill="#f3eefa" stroke="#6b3fa0" stroke-width="1.4"/>
      <text x="413" y="380" font-weight="700" fill="#4b2a72">母版拼接</text>
      <text x="413" y="398" font-size="10.5" fill="#6a5488">封面 + 片段 + BGM</text>
      <text x="413" y="412" font-size="10" fill="#a495b8">master.mp4</text>
    </g>
    <g>
      <rect x="526" y="356" width="170" height="66" rx="7" fill="#f3eefa" stroke="#6b3fa0" stroke-width="1.4"/>
      <text x="611" y="380" font-weight="700" fill="#4b2a72">高清放大</text>
      <text x="611" y="398" font-size="10.5" fill="#6a5488">可选 · 自检帧数</text>
      <text x="611" y="412" font-size="10" fill="#a495b8">_master_WxH.mp4</text>
    </g>
    <g>
      <rect x="724" y="356" width="170" height="66" rx="7" fill="#f3eefa" stroke="#6b3fa0" stroke-width="1.4"/>
      <text x="809" y="380" font-weight="700" fill="#4b2a72">字幕烧录</text>
      <text x="809" y="398" font-size="10.5" fill="#8f2a25">无对齐结果 → 拒绝出片</text>
      <text x="809" y="412" font-size="10" fill="#a495b8">_normdelivery.mp4</text>
    </g>
    <g>
      <rect x="922" y="356" width="170" height="66" rx="7" fill="#f3eefa" stroke="#6b3fa0" stroke-width="1.4"/>
      <text x="1007" y="380" font-weight="700" fill="#4b2a72">发行导出</text>
      <text x="1007" y="398" font-size="10.5" fill="#6a5488">合规预检 + 发行资料</text>
      <text x="1007" y="412" font-size="10" fill="#6a5488">EpisodeNN.mp4</text>
    </g>
  </g>
  <g stroke="#8b95a3" stroke-width="1.3" marker-end="url(#ar)">
    <line x1="300" y1="389" x2="323" y2="389"/>
    <line x1="498" y1="389" x2="521" y2="389"/>
    <line x1="696" y1="389" x2="719" y2="389"/>
    <line x1="894" y1="389" x2="917" y2="389"/>
  </g>

  <!-- 底部三条判据 -->
  <line x1="16" y1="448" x2="1124" y2="448" stroke="#e2e6ec" stroke-width="1"/>
  <g font-size="10.8" fill="#6b7480">
    <text x="16" y="470">状态只认磁盘：有产物 = 完成，没产物 = 待办 —— 所以任何一步都能单独重跑，改一条提示词不必从头再来。</text>
    <text x="16" y="490">花钱的动作默认干跑：要真提交得显式确认，报价只看台账里的真实消耗，不做估算。</text>
    <text x="16" y="510">交付规格不过关就不导出：字幕必须有对齐证据，9:16 靠裁切而不是补边。</text>
  </g>
</svg>
