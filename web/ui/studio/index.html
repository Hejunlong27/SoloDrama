<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SoloDrama Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="一个人的短剧剧组 —— AI 短剧批量生产工作台">
<meta name="theme-color" content="#0d0f12">
<!-- 图标：SVG 优先（清晰、可随主题缩放），PNG/ICO 兜底老浏览器 -->
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="shortcut icon" href="img/favicon.ico">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- ★ 静态资源必须带版本号（本项目零构建，直接改源文件）。
     不带版本号时，Chrome 会按「(现在 - Last-Modified) 的 10%」做启发式缓存，
     于是改完 css/js 刷新页面看到的还是旧文件 —— 表现是「改了没生效」。
     2026-11-04 踩过一次：画布样式写完了，页面上一个格子都没有。
     发布时把下面这个日期串改一次，强制所有客户端取新文件；开发期刷新即可（服务端已发 no-cache）。 -->
<link rel="stylesheet" href="css/tokens.css?v=20261110g">
<link rel="stylesheet" href="css/app.css?v=20261110g">
<!-- 2.0 新组件：只新增类名（.sd-* / .btn.danger），不改既有选择器。
     .btn.danger 的唯一来源在这里（app.css 只留注释指向本文件）。 -->
<link rel="stylesheet" href="css/components-2.css?v=20261110g">
<!-- 主题必须在 CSS 之前定下，否则深色用户会先看到一帧白底（闪白）。
     这 6 行是 theme.js 的精简版：只做「读记忆 → 解析 auto → 写 data-theme」。
     与 js/theme.js 的取值规则必须一致，改一处要改两处。 -->
<script>
(function () {
  try {
    var q = new URLSearchParams(location.search).get('theme');
    var m = (q === 'dark' || q === 'light') ? q : (localStorage.getItem('sd-theme') || 'auto');
    var t = (m === 'dark' || m === 'light') ? m
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    var d = document.documentElement;
    d.setAttribute('data-theme', t);
    d.setAttribute('data-theme-mode', m);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
</head>
<body>

<div class="loadbar" id="loadbar" aria-hidden="true"></div>

<div class="shell" id="shell">

  <aside class="nav">
    <div class="brand">
      <div class="brand-mark"><img src="img/logo.svg" alt="" width="26" height="26"></div>
      <div>
        <div class="brand-name">SoloDrama</div>
        <div class="brand-sub">STUDIO 2.0</div>
      </div>
    </div>
    <div class="nav-scroll" id="nav" role="navigation" aria-label="主导航"></div>
    <div class="nav-foot">
      <button class="btn ghost sm" id="btnCollapse" title="折叠侧栏（窄屏自动折叠）">
        <span data-ico="collapse"></span><span class="nav-text">折叠</span>
      </button>
      <span class="spacer"></span>
      <a class="btn ghost sm" href="../advanced.html" title="旧版开发者视图（命令面板 / 审计）">
        <span data-ico="terminal"></span>
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="proj-switch" id="projSwitch" title="切换剧项目">
        <i class="dot todo proj-dot" id="projDot"></i>
        <span class="proj-name" id="projName">未选择项目</span>
        <span class="proj-meta" id="projMeta"></span>
        <span data-ico="chevron"></span>
      </button>

      <div class="health" id="health"></div>
      <span class="spacer"></span>
      <!-- 资源监视（显存 / 内存 / 磁盘）：三项常驻，点开看详情与曲线 -->
      <div class="mon" id="monitor" role="group" aria-label="资源占用"></div>
      <span class="badge warn hide" id="roBadge" title="只读模式下所有写操作被拒绝">只读模式</span>
      <span class="badge outline" id="engineBadge" title="引擎解释器">引擎</span>
      <!-- 主题：深色看片 / 浅色写稿。三态（跟随系统/深/浅），点击循环切换。 -->
      <button class="btn ghost sm" id="btnTheme" title="主题：跟随系统 → 深色 → 浅色">跟随系统</button>
      <button class="btn ghost icon" id="btnRefresh" title="重新读取（清缓存）">
        <span data-ico="refresh"></span>
      </button>
    </header>

    <!-- 工作空间页签条：由 main.js 按当前路由填充；全局页（工作台/任务/设置）时隐藏 -->
    <div class="wsbar hide" id="wsbar"></div>

    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-h">
    <h3 id="drawerTitle">详情</h3>
    <span class="spacer"></span>
    <button class="btn ghost icon" data-close="drawer" title="关闭">
      <span data-ico="close"></span>
    </button>
  </div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f" id="drawerFoot"></div>
</aside>

<div class="modal" id="modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-h">
    <span id="modalIcon" data-ico="alert"></span>
    <h3 id="modalTitle">确认</h3>
    <span class="spacer"></span>
    <button class="btn ghost icon" data-close="modal" title="关闭">
      <span data-ico="close"></span>
    </button>
  </div>
  <div class="modal-b" id="modalBody"></div>
  <div class="modal-f" id="modalFoot"></div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="js/main.js?v=20261105a"></script>
</body>
</html>
